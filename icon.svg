<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a0a0a"/>
      <stop offset="100%" stop-color="#0a0a0f"/>
    </linearGradient>
    <linearGradient id="ff" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff9a00"/>
      <stop offset="100%" stop-color="#ff0000"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  
  <g filter="url(#glow)" stroke="#000" stroke-width="4" stroke-opacity="0.3">
    <!-- First F -->
    <path fill="url(#ff)" d="M120 140 H 250 V 190 H 180 V 240 H 230 V 290 H 180 V 380 H 120 Z" />
    
    <!-- Second F -->
    <path fill="url(#ff)" d="M260 140 H 390 V 190 H 320 V 240 H 370 V 290 H 320 V 380 H 260 Z" />
  </g>
</svg>
